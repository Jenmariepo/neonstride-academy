services:
  - type: web
    name: neonstride-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/leaderboard
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/neonstride.sqlite
      - key: CLIENT_URL
        sync: false
    disk:
      name: neonstride-data
      mountPath: /var/data
      sizeGB: 1
